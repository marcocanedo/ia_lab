[project]
name = "ageste-difal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4.3",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.5.8",
    "mstrio-py>=11.6.5.101",
    "notebook>=7.5.7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "streamlit>=1.41.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "difal_report_chunks",
    "freeform_snapshot_export",
    "microstrategy_client",
]

[tool.setuptools.package-dir]
"" = "src"
