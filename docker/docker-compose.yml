name: ia-lab

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-main}
    container_name: open-webui
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "${OPEN_WEBUI_HOST_PORT:-3000}"
      ENABLE_OLLAMA_API: "true"
      ENABLE_OPENAI_API: "true"
      OLLAMA_BASE_URLS: "${OLLAMA_BASE_URLS}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}"
      OPENAI_API_BASE_URLS: "${OPENAI_API_BASE_URLS}"
      OPENAI_API_KEYS: "${OPENAI_API_KEYS}"
      NO_PROXY: "localhost,127.0.0.1,10.14.0.226,172.25.112.1,172.25.112.0/20,172.30.224.1,172.30.0.0/16"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: "localhost,127.0.0.1,10.14.0.226,172.25.112.1,172.25.112.0/20,172.30.224.1,172.30.0.0/16"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    volumes:
      - open-webui:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-3000}/api/config >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  open-webui:
    external: true
